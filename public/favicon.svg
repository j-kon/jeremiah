<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="glow" cx="30%" cy="30%" r="75%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#F5B544" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F5B544" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="#06070A"/>
  <!-- Subtle border -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#1E293B" stroke-width="1.5"/>
  <!-- Amber ambient glow -->
  <rect width="64" height="64" rx="16" fill="url(#glow)"/>

  <!-- JJ monogram -->
  <text
    x="32"
    y="45"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-weight="800"
    font-size="30"
    fill="#F5B544"
    text-anchor="middle"
    letter-spacing="-1"
  >JJ</text>
</svg>
